name: Feature request
description: Suggest an idea for WordcloudGen
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that is awkward or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which part does this affect?
      options: ["The desktop app", "The command line", "Both", "Not sure"]
