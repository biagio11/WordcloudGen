# Conda environment for WordcloudGen.
#   conda env create -f environment.yml
#   conda activate wordcloud-env
#   python setup_nltk.py
#
# Prefer plain pip? Use requirements.txt instead.
name: wordcloud-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.24
  - matplotlib>=3.7
  - pillow>=10.0
  - wordcloud>=1.9.3
  - nltk>=3.9
  - pip
  - pip:
      - pymupdf>=1.24
      - customtkinter>=5.2,<7
      - tkinterdnd2>=0.4
