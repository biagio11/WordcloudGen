[project]
name = "wordcloudgen"
version = "1.1.0"
description = "Generate word clouds from PDF, Word or text files, from the command line or a desktop app."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "biagio11" }]
keywords = ["wordcloud", "nlp", "pdf", "visualization", "customtkinter"]
license = { text = "CC-BY-NC-SA-4.0" }

dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "wordcloud>=1.9.3",
    "nltk>=3.9",
    "pymupdf>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
gui = [
    "customtkinter>=5.2,<7",
    "tkinterdnd2>=0.4",
]
dev = ["pytest>=8.0", "ruff>=0.6", "pyinstaller>=6.6"]

[project.urls]
Homepage = "https://github.com/biagio11/WordcloudGen"
Issues = "https://github.com/biagio11/WordcloudGen/issues"

[tool.setuptools]
packages = ["wordcloudgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", "fonts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines are handled by the formatter, not enforced here
    "B008",  # false positives on tkinter widget construction in call args
]

[tool.ruff.lint.per-file-ignores]
"wordcloud_gen_GUI.py" = ["E402"]  # sys.path shim must run before local imports
"tests/*" = ["E402"]
"*.spec" = ["F821"]  # PyInstaller injects Analysis/PYZ/EXE/COLLECT
